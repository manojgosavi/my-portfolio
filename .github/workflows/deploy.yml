name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v4

      - name: Deploy site/ to manojgosavi.github.io
        run: |
          git clone https://x-access-token:${{ secrets.PAGES_DEPLOY_TOKEN }}@github.com/manojgosavi/manojgosavi.github.io.git /tmp/pages

          # Mirror site/ into the Pages repo. --delete removes files that no longer
          # exist in site/ (e.g. old build bundles); .git and README.md are kept.
          # Files starting with "_" (like notes/_template.html) are not published.
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'README.md' \
            --exclude '_*' \
            site/ /tmp/pages/
          touch /tmp/pages/.nojekyll

          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Deploy from my-portfolio@${{ github.sha }}"
          git push origin main
